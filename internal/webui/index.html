<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>porthole</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light dark;
    --bg: #0b0e14;
    --panel: #12161f;
    --border: #232838;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #5fd3a3;
    --danger: #e5566b;
    --locked: #d9a441;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sub {
    color: var(--muted);
    margin: 0 0 20px;
    font-size: 12px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  th, td {
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th {
    color: var(--muted);
    font-weight: 500;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .locked { color: var(--locked); }
  .btn {
    font: inherit;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--danger);
    cursor: pointer;
  }
  .btn:hover { background: rgba(229, 86, 107, 0.12); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .empty { color: var(--muted); padding: 20px; text-align: center; }
  .pulse { color: var(--accent); }
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 12px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <h1>porthole <span class="pulse" id="pulse">●</span></h1>
  <p class="sub" id="status">loading…</p>
  <table id="table">
    <thead>
      <tr>
        <th>Port</th><th>Proto</th><th>PID</th><th>Process</th>
        <th>Project</th><th>Container</th><th>Uptime</th><th></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="toast" id="toast"></div>

<script>
const rowsEl = document.getElementById('rows');
const statusEl = document.getElementById('status');
const pulseEl = document.getElementById('pulse');
const toastEl = document.getElementById('toast');
let pulseOn = false;

function fmtUptime(s) {
  if (!s || s <= 0) return '-';
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  if (d > 0) return d + 'd';
  if (h > 0) return h + 'h ' + m + 'm';
  return m + 'm';
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2500);
}

async function killRow(svc, btn) {
  if (!confirm('Kill ' + (svc.process || '?') + ' on :' + svc.port + '?')) return;
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const res = await fetch('/api/kill', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        pid: svc.pid, start_time: svc.start_time, owned: svc.owned, container_id: svc.container_id || ''
      }),
    });
    const body = await res.json();
    if (body.status === 'killed' || body.status === 'already_dead') {
      showToast('terminated :' + svc.port);
    } else if (body.status === 'needs_escalation') {
      showToast(':' + svc.port + ' ignored the signal — try again to force-kill');
    } else {
      showToast('failed: ' + (body.error || body.status));
    }
  } catch (e) {
    showToast('request failed: ' + e);
  }
  refresh();
}

function render(services) {
  if (services.length === 0) {
    rowsEl.innerHTML = '<tr><td colspan="8" class="empty">no services listening</td></tr>';
    return;
  }
  rowsEl.innerHTML = '';
  for (const svc of services) {
    const tr = document.createElement('tr');
    if (!svc.owned) tr.classList.add('locked');

    const cells = [
      svc.port, svc.proto, svc.pid || '-',
      svc.process || '?', svc.project || '-', svc.container || '-',
      fmtUptime(svc.uptime_seconds),
    ];
    for (const c of cells) {
      const td = document.createElement('td');
      td.textContent = c;
      tr.appendChild(td);
    }

    const actionTd = document.createElement('td');
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = 'kill';
    btn.disabled = !svc.owned;
    btn.onclick = () => killRow(svc, btn);
    actionTd.appendChild(btn);
    tr.appendChild(actionTd);

    rowsEl.appendChild(tr);
  }
}

async function refresh() {
  try {
    const res = await fetch('/api/services');
    const services = await res.json();
    render(services);
    const locked = services.filter(s => !s.owned).length;
    statusEl.textContent = services.length + ' service' + (services.length === 1 ? '' : 's') +
      (locked > 0 ? ' · ' + locked + ' locked' : '');
    pulseOn = !pulseOn;
    pulseEl.style.opacity = pulseOn ? '1' : '0.3';
  } catch (e) {
    statusEl.textContent = 'scan failed: ' + e;
  }
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
