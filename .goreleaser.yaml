# GoReleaser config for porthole — local tooling only, never run against
# a real release (no tag, no publish, nothing pushed).
#
# Verified for real: `goreleaser check` passes (v2.17.1) except one
# expected, intentional deprecation warning (`brews`, see its own comment
# below), and `goreleaser release --snapshot --clean` succeeded end to
# end — all 6 platform/arch binaries built, archived, checksummed; the
# generated Homebrew formula and Scoop manifest were inspected directly
# and used to correct the standalone reference templates in packaging/,
# which had gotten a few structural details wrong on the first guess
# (see packaging/homebrew/porthole.rb and packaging/scoop/porthole.json).
# The resulting windows_amd64 binary was run directly and correctly
# reported the ldflags-injected version.
version: 2

project_name: porthole

before:
  hooks:
    - go mod tidy

builds:
  - id: porthole
    main: ./cmd/porthole
    binary: porthole
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/subh05sus/porthole/internal/cli.Version={{ .Version }}

archives:
  - id: porthole
    ids: [porthole]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: subh05sus
    name: porthole
  # Local-only this session per explicit user choice — draft rather than
  # auto-published, so a stray `goreleaser release` run doesn't publish
  # anything without a deliberate follow-up click.
  draft: true

# NOTE: `brews` is flagged deprecated by `goreleaser check` in favor of
# `homebrew_casks`, but deliberately kept here rather than migrated —
# Casks are historically a macOS-only mechanism (they carry the .app-
# bundle/quarantine-attribute concepts of a GUI installer, even for a
# plain CLI binary), and GoReleaser's own docs don't clearly confirm cask
# support on Linuxbrew. `brews` still functions today (deprecated, not
# removed) and is the only path that's actually cross-platform. Revisit
# if/when GoReleaser drops `brews` support entirely.
brews:
  - name: porthole
    repository:
      owner: subh05sus
      name: homebrew-tap
    directory: Formula
    homepage: "https://github.com/subh05sus/porthole"
    description: "A port kill switch and service viewer for your terminal."
    license: "MIT"

scoops:
  - name: porthole
    repository:
      owner: subh05sus
      name: scoop-bucket
    homepage: "https://github.com/subh05sus/porthole"
    description: "A port kill switch and service viewer for your terminal."
    license: "MIT"
